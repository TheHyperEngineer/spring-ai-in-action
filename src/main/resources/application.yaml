server:
    port: 8081
spring:
  application:
    name: board-game-buddy
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aichatdb}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-5-nano
      embedding:
        options:
          model: text-embedding-3-small
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: ALWAYS
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_GRPC_PORT:6334}     # gRPC port (default 6334)
        initialize-schema: true
        collection-name: board-game-buddy
        check-collection-exists: true
        check-compatibility: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    enabled: true

logging:
  level:
    org:
      zalando:
        logbook: TRACE
      springframework:
        web: DEBUG
        jdbc: DEBUG
        ai: DEBUG
logbook:
  format:
    style: http

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env

