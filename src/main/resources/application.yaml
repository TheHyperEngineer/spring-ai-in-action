# Application configuration for Board Game Buddy
spring:
  application:
    name: board-game-buddy

  # Configurations for OpenAI integration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-5-nano
    vectorstore:
      qdrant:
        initialize-schema: true
        collection-name: board-game-buddy
    mcp:
      client:
        stdio:
          connections:
            filesystem:
              command: 'npx'
              args:
                - '-y'
                - '@modelcontextprotocol/server-filesystem'
                - '/Users/habuma/mcp-playground'
        toolcallback:
          enabled: true

# Configurations for Springdoc OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    enabled: true

# Logging configuration for detailed output from Logbook and Spring components
logging:
  level:
    org:
      zalando:
        logbook: TRACE
      springframework:
        web: DEBUG
        jdbc: DEBUG
        ai: DEBUG

# Logbook configuration for HTTP request and response logging
logbook:
  format:
    style: http

# Actuator configuration to expose health, info, metrics, loggers, and environment endpoints for monitoring and diagnostics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env

