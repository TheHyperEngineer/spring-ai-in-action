# Application properties for the Cyberjar Tool demo application
spring.application.name=cyberjar-mcp-tool-demo

# Set the OpenAI API key from the environment variable
my.openai.api.key=${OPENAI_API_KEY}

# Logging configuration
logging.level.org.springframework.ai=INFO
logging.level.com.embabel=INFO
logging.level.org.springframework.boot=INFO


spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=mcp-client-cloudflare-demo
spring.ai.mcp.client.version=1.0.0
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.sse.connections.mcp-cloudflare-server.url=https://demo-day.mcp.cloudflare.com/sse