spring.application.name=cyberjar-demo
spring.main.web-application-type=none
spring.shell.interactive.enabled=true
embabel.models.default-llm=gpt-5-nano
embabel.models.auto-register=false
# ADD THIS LINE to exclude starter auto-config (per User Guide 0.3.4)
spring.autoconfigure.exclude=com.embabel.agent.autoconfigure.openai.OpenAiAutoConfiguration
# ADD THIS LINE to disable OpenAI starter auto-config and fake models
embabel.agent.platform.models.openai.enabled=false
my.openai.api.key=${OPENAI_API_KEY}
logging.level.org.springframework.ai=DEBUG
logging.level.com.embabel=DEBUG


